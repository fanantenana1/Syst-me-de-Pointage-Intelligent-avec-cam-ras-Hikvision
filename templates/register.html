<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter un utilisateur</title>
  <link href="https//cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #f8f9fa, #e9ecef);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .form-container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.05);
      max-width: 700px;
      margin: auto;
    }

    h2 {
      text-align: center;
      font-weight: 600;
      margin-bottom: 25px;
      color: #343a40;
    }

    .image-preview-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
      border: 1px solid #dee2e6;
      border-radius: 10px;
      background-color: #f8f9fa;
    }

    .image-preview-container img {
      height: 100px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid #ced4da;
    }

    .btn-primary {
      background-color: #0069d9;
      border: none;
    }

    .btn-outline-success {
      border-radius: 8px;
    }

    .form-label {
      font-weight: 500;
    }

    .alert {
      text-align: center;
    }
  </style>
</head>
<body class="p-4">
  <div class="form-container">
    <h2>Ajouter un nouvel utilisateur</h2>

    {% if message %}
      <div class="alert alert-success">{{ message }}</div>
    {% endif %}

    <form action="/register" method="post" enctype="multipart/form-data">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Nom :</label>
          <input type="text" name="name" class="form-control" required>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Prénom :</label>
          <input type="text" name="prenom" class="form-control" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">CIN :</label>
        <input type="text" name="cin" class="form-control" required placeholder="Ex : AB123456">
      </div>

      <div class="mb-3">
        <label class="form-label">Email :</label>
        <input type="email" name="email" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Téléphone :</label>
        <input type="tel" name="telephone" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Adresse :</label>
        <textarea name="adresse" class="form-control" rows="2"></textarea>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Genre :</label>
          <select name="genre" class="form-select">
            <option value="">Choisir...</option>
            <option value="Homme">Homme</option>
            <option value="Femme">Femme</option>
            <option value="Autre">Autre</option>
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Date de naissance :</label>
          <input type="date" name="date_naissance" class="form-control">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Photos :</label>
        <input type="file" name="photos" class="form-control" accept="image/*" multiple onchange="previewMultipleImages(event)" required>
      </div>

      <div class="mb-3 image-preview-container" id="imagePreviewContainer">
        <!-- Aperçu des images -->
      </div>

      <div class="d-grid gap-2 mt-4">
        <button type="submit" class="btn btn-primary">✅ Enregistrer</button>
        <a href="/capture" class="btn btn-outline-success">📷 Capturer une photo</a>
      </div>
    </form>
  </div>

  <script>
    function previewMultipleImages(event) {
      const container = document.getElementById('imagePreviewContainer');
      container.innerHTML = "";
      const files = event.target.files;

      for (let i = 0; i < files.length; i++) {
        const fileReader = new FileReader();

        fileReader.onload = function(e) {
          const img = document.createElement('img');
          img.src = e.target.result;
          container.appendChild(img);
        }

        fileReader.readAsDataURL(files[i]);
      }
    }
  </script>
</body>
</html>
