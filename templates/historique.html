<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Historique</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    function deleteImage(id) {
      if (confirm("Supprimer cette image ?")) {
        fetch(`/delete_image/${id}`, { method: 'POST' })
          .then(res => location.reload());
      }
    }

    function deleteVideo(id) {
      if (confirm("Supprimer cette vidéo ?")) {
        fetch(`/delete_video/${id}`, { method: 'POST' })
          .then(res => location.reload());
      }
    }

    function filterByDate() {
      const date = document.getElementById("filterDate").value;
      window.location.href = "/historique?date=" + date;
    }
  </script>
</head>
<body class="bg-light">
  <div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Historique des Captures</h2>
      <div class="d-flex gap-2">
        <input type="date" id="filterDate" class="form-control" value="{{ selected_date }}">
        <button class="btn btn-outline-secondary" onclick="filterByDate()">🔍 Rechercher</button>
        <button class="btn btn-outline-dark" onclick="window.location.href='/home'">Accueil</button>
      </div>
    </div>

    <h4 class="mt-4">Images enregistrées</h4>
    <div class="row">
      {% for image in images %}
      <div class="col-md-4 col-sm-6 mb-4">
        <div class="card shadow-sm">
          <img src="{{ image.image_url }}" class="card-img-top" alt="Image enregistrée">
          <div class="card-body">
            <p class="card-text">Date : {{ image.created_at.strftime('%d/%m/%Y %H:%M:%S') }}</p>
            <button class="btn btn-danger btn-sm" onclick="deleteImage('{{ image._id }}')">🗑 Supprimer</button>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>

    <h4 class="mt-5">Vidéos enregistrées</h4>
    <div class="row">
      {% for video in videos %}
      <div class="col-md-6 col-sm-12 mb-4">
        <div class="card shadow-sm">
          <video class="card-img-top" controls>
            <source src="{{ video.video_url }}" type="video/mp4">
          </video>
          <div class="card-body">
            <p class="card-text">Date : {{ video.created_at.strftime('%d/%m/%Y %H:%M:%S') }}</p>
            <button class="btn btn-danger btn-sm" onclick="deleteVideo('{{ video._id }}')">🗑 Supprimer</button>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>

  </div>
</body>
</html>
