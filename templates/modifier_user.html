<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Modifier Utilisateur</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #dbeafe, #f0f4ff);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background-color: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 30px;
      width: 100%;
      max-width: 600px;
      animation: fadeIn 0.7s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card h4 {
      color: #0d6efd;
      font-weight: 600;
      margin-bottom: 25px;
    }

    label {
      font-weight: 500;
      color: #333;
    }

    .form-control {
      border-radius: 10px;
      transition: border 0.3s ease;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.2);
    }

    .btn-primary {
      background: #0d6efd;
      border: none;
      border-radius: 10px;
    }

    .btn-primary:hover {
      background: #0b5ed7;
    }

    .btn-secondary {
      border-radius: 10px;
    }

    .btn {
      padding: 8px 20px;
    }

    .text-end {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h4 class="text-center">✏️ Modifier l'utilisateur</h4>
    <form action="/modifier_user/{{ user._id }}" method="post">
      <div class="mb-3">
        <label for="name" class="form-label">Nom complet</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
      </div>
      <div class="mb-3">
        <label for="cin" class="form-label">CIN</label>
        <input type="text" class="form-control" id="cin" name="cin" value="{{ user.cin }}" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ user.email or '' }}">
      </div>
      <div class="mb-3">
        <label for="telephone" class="form-label">Téléphone</label>
        <input type="text" class="form-control" id="telephone" name="telephone" value="{{ user.telephone or '' }}">
      </div>
      <div class="text-end">
        <a href="/liste_user" class="btn btn-secondary me-2">↩️ Annuler</a>
        <button type="submit" class="btn btn-primary">💾 Enregistrer</button>
      </div>
    </form>
  </div>

</body>
</html>
